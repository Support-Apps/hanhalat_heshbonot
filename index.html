<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בס"ד | הלקוחות והספקים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Heebo:wght@300;400;500;600&family=Noto+Serif+Hebrew:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--card:#fff;--tile:#f6f2eb;--sand:#ede8e1;--ink:#1f2430;--mute:#8c8173;--pri:#b89a6a;--btn:#1f2430;--onbtn:#fff;--red:#b45353;--grn:#2f6b55;--line:#e6dccb;--sh:0 14px 36px rgba(31,36,48,.06);--hd:'Cormorant Garamond','Noto Serif Hebrew',serif;--bd:'Heebo','Assistant',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bd);font-weight:400;font-size:16px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font-family:var(--bd)}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 130px}
.bsd{font-family:var(--hd);font-weight:700;font-size:18px;color:var(--pri);letter-spacing:.12em}
.top{display:flex;justify-content:flex-start;align-items:flex-start;gap:12px}
.hi{display:flex;gap:10px;align-items:center;margin-top:4px}
.av{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 19px var(--hd);border:0;cursor:pointer}
.hi b{font:600 21px var(--hd);display:block;letter-spacing:.01em}.hi small{color:var(--mute);font-size:13px;font-weight:300}
h1{font:600 32px/1.15 var(--hd);margin:20px 0 4px;display:flex;align-items:center;gap:10px;letter-spacing:.005em}
h1 svg{color:var(--pri)}
.sub{color:var(--mute);font-size:14px;font-weight:300;letter-spacing:.04em;margin:0 0 16px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 16px;height:52px;color:var(--mute)}
.search:focus-within{border-color:var(--pri)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0;margin:0;padding:0;width:auto}
.row{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);font:400 14px var(--bd);padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:focus-visible,.btn:focus-visible,.act:focus-visible,.item:focus-visible,.tab:focus-visible,.vsw:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sp{flex:1}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border-radius:22px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--line);cursor:pointer;color:var(--ink);font:inherit;transition:.15s}
.item:hover{border-color:var(--pri)}
.ic{width:46px;height:46px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--pri);display:grid;place-items:center;flex:none}
.item .n{flex:1;min-width:0}.item .n b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n small{color:var(--mute);font-size:12.5px;font-weight:300}
.amt,.big .v,.g2 .v,.st .v{font-family:var(--hd);font-feature-settings:"lnum","tnum";font-variant-numeric:lining-nums tabular-nums}
.amt{font-weight:700;font-size:18px;direction:ltr;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--ink)}
.chev{color:var(--mute);flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.8;font-weight:300}
.fab{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;flex-wrap:wrap;gap:8px;z-index:5;pointer-events:none;padding:0 12px}.fab .btn{pointer-events:auto;padding:12px 18px}
.btn{border:1px solid var(--ink);font:500 14px var(--bd);letter-spacing:.04em;border-radius:999px;padding:13px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--onbtn);box-shadow:0 10px 24px rgba(31,36,48,.14);transition:.15s}
.btn:hover{background:var(--pri);border-color:var(--pri);color:var(--ink)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sec:hover{border-color:var(--pri);color:var(--pri);background:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.back{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px 0;font:400 14px var(--bd);display:flex;align-items:center;gap:4px;margin-top:6px}
.back:hover{color:var(--pri)}
.hd{text-align:center;margin-top:6px}
.hd .ic{margin:0 auto 10px;width:58px;height:58px;border-radius:18px}
.hd h2{font:600 28px/1.2 var(--hd);margin:0 0 4px}
.hd small{color:var(--mute);font-size:14px;font-weight:300}
.tabs{display:flex;gap:6px;background:var(--sand);border-radius:999px;padding:5px;margin:16px 0;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;border:0;background:none;font:500 14px var(--bd);padding:10px 18px;border-radius:999px;cursor:pointer;color:var(--mute);white-space:nowrap;transition:.15s}
.tab.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.big{display:flex;gap:14px;align-items:center}
.big .ic{width:50px;height:50px}
.big small{color:var(--mute);display:block;font-size:13px;font-weight:300}
.big .v{font-size:38px;font-weight:700;direction:ltr;text-align:start;line-height:1.1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin:0}.g2 small{color:var(--mute);font-size:13px;font-weight:300;display:block}.g2 .v{font-weight:700;font-size:26px;margin-top:6px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.act{position:relative;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:13px 4px;font:500 12.5px var(--bd);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center;transition:.15s}
.act:hover{border-color:var(--pri)}
.act svg{color:var(--pri)}.act.wa svg{color:var(--grn)}
.act i{position:absolute;top:6px;inset-inline-end:8px;background:var(--red);color:#fff;font:600 11px var(--bd);font-style:normal;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.dc{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.dc:first-child{border:0}.dc .n{flex:1;min-width:0}.dc b{display:block;font-weight:500}.dc small{color:var(--mute);font-weight:300}
.mini{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px;transition:.15s}
.mini:hover{border-color:var(--pri);color:var(--pri)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--sand);color:var(--mute);margin-inline-start:6px}
.tag.ok{background:#e3efe9;color:var(--grn)}
.login{max-width:380px;margin:6vh auto 0}.login .tab{flex:1}
.tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.bell{position:relative;border:1px solid var(--line);background:#fff;color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.bell i{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--red);color:#fff;font:600 12px var(--bd);font-style:normal;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.bell:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.vsw{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;cursor:pointer;font:400 12.5px var(--bd);color:var(--mute)}
.vsw span{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;transition:.15s}
.vsw span.on{background:var(--ink);color:#fff}
.vsw svg{width:16px;height:16px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--ink);font-size:15px}.chk input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.gh{font-size:12.5px;color:var(--mute);margin:18px 0 8px;font-weight:500;letter-spacing:.08em}
dl{margin:0}dt{color:var(--mute);font-size:13px;font-weight:300;margin-top:14px}dd{margin:2px 0 0;font-size:16px;font-weight:400;overflow-wrap:anywhere}
dd a{color:var(--pri);text-decoration:none;direction:ltr;unicode-bidi:plaintext}
.tw{overflow-x:auto;border-radius:18px;background:var(--card);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{background:var(--bg);color:var(--mute);text-align:start;padding:11px 10px;font-weight:500;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line)}
td.n{font-family:var(--hd);font-weight:600;font-size:15px;font-feature-settings:"lnum","tnum";direction:ltr;text-align:end;white-space:nowrap}
tfoot td{font-weight:600;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar span:first-child{width:90px;font-size:13px;color:var(--mute);flex:none}
.bar i{display:block;height:10px;border-radius:6px;background:var(--pri);min-width:3px}.bar .tr{flex:1;background:var(--sand);border-radius:6px;overflow:hidden}
.bar b{font-family:var(--hd);font-weight:600;font-size:15px;direction:ltr;min-width:84px;text-align:end}
.prog{height:6px;border-radius:3px;background:var(--sand);overflow:hidden;margin:6px 0 10px}.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.thumb{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none;border:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:26px;background:#fff;color:var(--ink);width:min(92vw,520px);padding:22px;font-family:var(--bd);max-height:90vh;box-shadow:0 30px 80px rgba(31,36,48,.22)}
dialog::backdrop{background:rgba(31,36,48,.42)}
dialog h3{margin:0 0 12px;font:600 26px var(--hd)}
label{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-top:12px}
input,select,textarea{width:100%;margin-top:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.dl{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hint{font-size:13.5px;color:var(--mute);line-height:1.75;font-weight:300}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.st .card{margin:0;padding:12px 14px}.st small{color:var(--mute);font-size:12px;font-weight:300;display:block}.st .v{font-size:20px;font-weight:700;margin-top:4px;direction:ltr;text-align:start}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;font-size:12px;padding:10mm}#print table{min-width:0;font-size:11px}#print th{background:#eee}#print td,#print th{border:1px solid #bbb;padding:5px}#print h2{margin:4px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.vsw span{padding:7px 9px}.acts{gap:8px}.act{font-size:12px}}
.mob body{background:#fff}.mob .wrap{max-width:430px;background:#fff;min-height:100vh;box-shadow:0 0 0 1px var(--line)}
.qa{grid-template-columns:repeat(5,1fr);gap:8px}.qa .act{font-size:11.5px;padding:12px 2px}a.btn{text-decoration:none}
.desk .wrap{max-width:1120px}.desk #lst{display:grid;grid-template-columns:1fr 1fr;gap:12px}.desk #lst .item{margin:0}.desk .g2{grid-template-columns:repeat(3,1fr)}.desk .acts{grid-template-columns:repeat(4,minmax(0,200px))}.desk .qa{grid-template-columns:repeat(5,minmax(0,200px))}.desk .tg{grid-template-columns:repeat(4,1fr)}.desk dialog{width:min(92vw,660px)}
</style>
</head>

const TODAY=new Date();
const iso=d=>d.toISOString().slice(0,10);
const ago=n=>{const d=new Date(TODAY);d.setDate(d.getDate()-n);return iso(d)};
const fmt=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const heDate=s=>{if(!s)return'';const [y,m,d]=String(s).slice(0,10).split('-');return `${d}.${m}.${y}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  {d:ago(40),ref:'S-1',desc:'חשבונית ספק',debit:0,credit:4500,due:ago(10)}]}
]}
let VM=localStorage.getItem('hs_view')||(innerWidth>900?'desk':'mob');
function applyView(){document.documentElement.classList.remove('mob','desk');document.documentElement.classList.add(VM)}applyView();
const vwHtml=()=>`<span class="${VM==='mob'?'on':''}">${I.mob}מובייל</span><span class="${VM==='desk'?'on':''}">${I.desk}מחשב</span>`;

function load(){let r=null;try{r=JSON.parse(localStorage.getItem(SK())||'null')}catch(e){}
 S=r&&r.accts?r:{name:users()[U]?.name||'משתמש',accts:demo()};S.set=Object.assign({od:90,soon:7,bn:false,last:''},S.set);S.rem=S.rem||[];S.tpl=S.tpl||defTpl();S.log=S.log||[]}
function save(){try{localStorage.setItem(SK(),JSON.stringify(S))}catch(e){}}
async function hash(p,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of salt+p)h=(h*31+c.charCodeAt(0))|0;return'f'+h}}

 $('#app').innerHTML=`<div class="top"><div class="bsd">בס"ד</div><span class="tools">${viewBtn()}</span></div><div class="login"><div class="ic" style="margin:0 auto 14px;width:60px;height:60px">${I.bld}</div><h1 style="justify-content:center;font-size:26px">הלקוחות והספקים שלי</h1><p class="sub" style="text-align:center">${up?'יצירת משתמש חדש':'כניסה עם שם משתמש וסיסמה'}</p>
 <div class="tabs"><button class="tab ${up?'':'on'}" data-m="in">כניסה</button><button class="tab ${up?'on':''}" data-m="up">משתמש חדש</button></div>
 <form id="lf"><label>שם משתמש<input name="u" autocomplete="username" required></label>${up?'<label>שם להצגה (לא חובה)<input name="n" placeholder="משתמש"></label>':''}<label>סיסמה<input name="p" type="password" autocomplete="${up?'new-password':'current-password'}" required minlength="4"></label><button class="btn" style="width:100%;justify-content:center;margin-top:18px">${up?'יצירת משתמש':'כניסה'}</button></form></div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>loginView(b.dataset.m));
 $('#lf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData($('#lf')));const u=f.u.trim().toLowerCase(),all=users();
  if(up){if(all[u])return toast('שם המשתמש תפוס');const salt=Math.random().toString(36).slice(2);all[u]={salt,h:await hash(f.p,salt),name:(f.n||'').trim()||'משתמש'};localStorage.setItem('hs_users',JSON.stringify(all))}
  else{const r=all[u];if(!r||r.h!==await hash(f.p,r.salt))return toast('שם משתמש או סיסמה שגויים')}
  U=u;localStorage.setItem('hs_sess',u);load();V={tab:'all',q:'',sort:'name',open:null,dt:'sum'};renderList();maybeNotify()}}
function userDlg(){const d=$('#dlg');d.innerHTML=`<h3>המשתמש שלי</h3><form method="dialog" id="uf"><label>שם להצגה<input name="n" value="${esc(S.name)}"></label><div class="dl"><button class="btn" value="ok">שמירה</button><button class="btn sec" value="x" formnovalidate>ביטול</button><button class="btn sec" type="button" id="bkp">גיבוי</button><button class="btn sec" type="button" id="rst">שחזור</button></div></form>`;if(!d.open)d.showModal();
 $('#bkp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`גיבוי-${U}-${iso(TODAY)}.json`;a.click()};
 $('#rst').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const r=JSON.parse(await i.files[0].text());if(!r.accts)throw 0;S=r;S.set=Object.assign({od:90,soon:7,bn:false,last:''},S.set);S.rem=S.rem||[];S.tpl=S.tpl||defTpl();S.log=S.log||[];save();d.close();renderList();toast('הנתונים שוחזרו')}catch(e){toast('קובץ גיבוי לא תקין')}};i.click()};
  $('#uf').onsubmit=e=>{if(e.submitter?.value!=='ok')return;const n=new FormData($('#uf')).get('n').trim()||'משתמש';S.name=n;const all=users();if(all[U]){all[U].name=n;localStorage.setItem('hs_users',JSON.stringify(all))}save();renderList()}}
let V={tab:'all',q:'',sort:'name',open:null,dt:'sum'};

const TD={'שוטף':0,'שוטף + 30':30,'שוטף + 60':60,'שוטף + 90':90};
function dueOf(t,a){if(t.due)return t.due;const x=a&&a.terms;if(!x||x==='מזומן'||!(x in TD))return t.d;const d=new Date(t.d+'T12:00'),e=new Date(d.getFullYear(),d.getMonth()+1,0,12);e.setDate(e.getDate()+TD[x]);return iso(e)}
const bal=a=>a.tx.length?a.tx.reduce((s,t)=>s+(+t.debit||0)-(+t.credit||0),0):(+a.balance||0);
const typeLbl=a=>a.type==='s'?'ספק':'לקוח';
function aging(a){
 const B=[{l:'שוטף / עתידי',v:0},{l:'עד 30 יום',v:0},{l:'31-60 יום',v:0},{l:'61-90 יום',v:0},{l:'מעל 90 יום',v:0}];
 a.tx.forEach(t=>{const n=(+t.debit||0)-(+t.credit||0);const days=Math.floor((TODAY-new Date(dueOf(t,a)))/864e5);
  B[days<=0?0:days<=30?1:days<=60?2:days<=90?3:4].v+=n});
 return B}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- list ---------- */
function list(){
 let L=S.accts.filter(a=>V.tab==='all'||(V.tab==='late'?a.type==='c'&&overdue(a)>0:a.type===V.tab));
 const q=V.q.trim().toLowerCase();
 if(q)L=L.filter(a=>(a.name+' '+a.id+' '+a.phone).toLowerCase().includes(q));
 L=[...L].sort((x,y)=>V.sort==='name'?x.name.localeCompare(y.name,'he'):V.sort==='bal'?Math.abs(bal(y))-Math.abs(bal(x)):x.id.localeCompare(y.id));
 return L}

 const L=list();
 $('#app').innerHTML=`
 <div class="top"><div class="bsd">בס"ד</div><div class="hi"><button class="av" id="avb" aria-label="המשתמש שלי">${esc(S.name[0]||'א')}</button><div><b>שלום, ${esc(S.name)}</b><small>טוב לראות אותך שוב</small></div></div>${bellBtn()}</div>

 <div class="acts qa"><button class="act" data-q="rm">${I.bell}תזכורות${dueRem().length?`<i>${dueRem().length}</i>`:''}</button><button class="act" data-q="bk">${I.snd}שליחה לחייבים</button><button class="act" data-q="hs">${I.hs}יצוא לחשבשבת</button><button class="act" data-q="dc">${I.pdf}מסמכים</button><button class="act" data-q="lg">${I.clk}יומן</button></div>

  ${[['all','הכל'],['c','לקוחות'],['s','ספקים'],['late','בפיגור']].map(([k,l])=>`<button class="chip ${V.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}
  <span class="sp"></span>
  <button class="chip" id="tpls">הודעות מובנות</button><button class="chip" id="srt">${I.srt} ${V.sort==='name'?'שם':V.sort==='bal'?'יתרה':'מספר'}</button>
 </div>
 <div id="lst">${rows(L)}</div>`;
 $('#fab').innerHTML=`<button class="btn" id="add">+ חשבון חדש</button><button class="btn sec" id="imp">${I.up} בחירת קבצים</button><button class="btn sec" id="tls">כלים</button>`;
 bind()}

 $('#imp')&&($('#imp').onclick=()=>$('#file').click());
 $('#expall')&&($('#expall').onclick=exportAll);

 hookItems()}

function copyTxt(t){const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove()};try{navigator.clipboard.writeText(t).catch(fb)}catch(e){fb()}}
function openExt(url,text){const web=/^https?:/.test(url);let w=null;try{if(web)w=window.open(url,'_blank');else location.href=url}catch(e){}
 if(web&&w)return;copyTxt(text||'');if(!web)return toast('אם לא נפתחה אפליקציה, ההודעה הועתקה ואפשר להדביק');extDlg(url,text)}
function extDlg(url,text){const d=$('#dlg');d.innerHTML=`<h3>פתיחת וואטסאפ</h3><p class="hint">הדפדפן חסם פתיחה אוטומטית. ההודעה הועתקה, אפשר ללחוץ על הקישור או להדביק ידנית.</p><label>ההודעה<textarea rows="5" readonly>${esc(text)}</textarea></label><div class="dl"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">פתיחה בוואטסאפ</a><button type="button" class="btn sec" id="xcp">העתקה</button><button type="button" class="btn sec" id="xcl">סגירה</button></div>`;
 if(!d.open)d.showModal();$('#xcl').onclick=()=>d.close();$('#xcp').onclick=()=>{copyTxt(text);toast('הועתק')}}
/* dialog forms are handled in JS, so buttons work even where native form submission is blocked */
$('#dlg').addEventListener('click',e=>{const b=e.target.closest('button'),f=b&&b.form;if(!f||!f.closest('dialog')||b.type==='button')return;e.preventDefault();const d=$('#dlg');
 if(b.value==='ok'){if(!f.reportValidity())return;if(f.onsubmit)f.onsubmit({submitter:b,preventDefault(){}});d.close()}else d.close()},true);
$('#dlg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.form){const ok=e.target.form.querySelector('button[value=ok]');if(ok){e.preventDefault();ok.click()}}});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
(function(){const k=Object.keys(users()),s=localStorage.getItem('hs_sess');U=(s&&users()[s]?s:k[0])||'me';load();renderList();maybeNotify()})();
</script>
</body>
</html>
